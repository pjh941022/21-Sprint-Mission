<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="/"><img src="img/icon.svg" /></a>
      <a class="nav_button" href="pages/login.html">로그인</a>
    </nav>
    <header class="banner">
      <div class="banner_inner">
        <div class="banner_title">
          <h2>일상의 모든 물건을<br />거래해 보세요</h2>
          <a href="pages/items.html">구경하러 가기</a>
        </div>
        <div class="banner_image">
          <img src="img/banner.svg" alt="배너 이미지" />
        </div>
      </div>
    </header>
    <main>
      <div class="card">
        <img src="img/card1.svg" alt="인기 상품" />
        <div class="card_title">
          <p>Hot item</p>
          <h2>인기 상품을<br />확인해 보세요</h2>
          <h3>
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </h3>
        </div>
      </div>
      <div class="card">
        <div class="card_title">
          <p>Search</p>
          <h2>구매를 원하는<br />상품을 검색하세요</h2>
          <h3>
            구매하고 싶은 물품은 검색해서<br />
            쉽게 찾아보세요
          </h3>
        </div>
        <img src="img/card2.svg" alt="검색" />
      </div>
      <div class="card">
        <img src="img/card3.svg" alt="등록" />
        <div class="card_title">
          <p>Register</p>
          <h2>판매를 원하는<br />상품을 등록하세요</h2>
          <h3>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</h3>
        </div>
      </div>
      <div class="card_sky">
        <div class="card_sky_inner">
          <div class="card_title">
            <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
          <img src="img/card4.svg" />
        </div>
      </div>
    </main>
    <footer>
      <div class="footer_container">
        <div class="footer_info">
          <p>@codeit - 2024</p>
        </div>
        <div class="footer_links">
          <p>
            <a href="pages/privacy.html" target="_blank">Privacy Policy</a>
            <a href="pages/faq.html" target="_blank">FAQ</a>
          </p>
        </div>
        <div class="footer_socials">
          <a href="https://www.facebook.com/"
            ><img src="img/facebook.svg" target="_blank"
          /></a>
          <a href="https://x.com/"
            ><img src="img/twitter.svg" target="_blank"
          /></a>
          <a href="https://www.youtube.com/"
            ><img src="img/youtube.svg" target="_blank" />
          </a>
          <a href="https://www.instagram.com/" target="_blank"
            ><img src="img/instagram.svg"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
