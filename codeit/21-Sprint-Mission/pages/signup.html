<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="login">
      <div class="login__container">
        <a href="../index.html">
          <img class="login__image" src="../img/login.svg" alt="아이콘"
        /></a>
        <form class="login__form">
          <div class="login__group">
            <label class="login__label" for="email">이메일</label>
            <input
              class="login__input"
              type="email"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="login__group">
            <label class="login__label" for="nickname">닉네임</label>
            <input
              class="login__input"
              type="text"
              id="nickname"
              name="nickname"
              required
            />
          </div>

          <div class="login__group">
            <label class="login__label" for="password">비밀번호</label>
            <input
              class="login__input"
              type="password"
              id="password"
              name="password"
              required
            />
          </div>
          <div class="login__group">
            <label class="login__label" for="password2">비밀번호 확인</label>
            <input
              class="login__input"
              type="password"
              id="password2"
              name="password2"
              required
            />
          </div>
          <button class="login__button" type="submit">회원가입</button>
        </form>

        <div class="login__signup">
          <p class="login__signup-text">
            이미 회원이신가요?
            <a class="login__signup-link" href="login.html">로그인</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
