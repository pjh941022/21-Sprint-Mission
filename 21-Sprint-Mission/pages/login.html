<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="../main.css" />
  </head>
  <body>
    <main class="login signup">
      <div class="login__container">
        <a href="../index.html">
          <img class="login__image" src="../img/login.svg"
        /></a>
        <form class="login__form" action="#" method="post">
          <div class="login__group">
              <label class="login__label" for="email">이메일</label>
              <input
                class="login__input"
                type="email"
                id="email"
                name="email"
                required
              />
            </div>
         
          <div class="login__group">
            <label class="login__label" for="password">비밀번호</label>
            <input
              class="login__input"
              type="password"
              id="password"
              name="password"
              required
            />
          </div>
          <button class="login__button" type="submit">
            로그인
          </button>
        </form>

        <div class="login__signup">
          <p class="login__signup-text">
            판다마켓이 처음인가요?
            <a class="login__signup-link" href="/21-Sprint-Mission/pages/signup.html">회원가입</a>
          </p>
        </div>
      </div>
       </div>
    </main>
  </body>
</html>
